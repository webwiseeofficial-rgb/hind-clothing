<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><meta name="robots" content="noindex"><title>Admin — Hind Clothing</title></head><body>
<div id="hdr"></div>
<main class="admin">
<form id="lf" class="panel hide"><h2>Connexion admin</h2><label>Email</label><input id="em" type="email" required><label>Mot de passe</label><input id="pw" type="password" required><div style="margin-top:18px"><button>Se connecter</button></div></form>
<div id="panel" class="hide">
<div style="text-align:right;margin-bottom:12px"><button id="out" class="danger">Déconnexion</button></div>
<h2>Ajouter un produit</h2>
<form id="af" class="panel"><label>Nom</label><input id="nm" required><label>Description</label><textarea id="ds"></textarea>
<label>Catégorie</label><select id="ct"><option value="pyjamas">Pyjamas</option><option value="hiver">Vêtements d’hiver</option><option value="ete">Vêtements d’été</option></select>
<label>Prix (DA)</label><input id="pr" type="number" min="0" required>
<label>Ancien prix (DA) — remplir pour mettre en soldes</label><input id="op" type="number" min="0">
<label>Photos (plusieurs possibles)</label><input id="img" type="file" accept="image/*" multiple>
<div style="margin-top:18px"><button id="addb">Ajouter</button></div></form>
<h2 style="margin-top:34px">Produits</h2><div class="list" id="plist"></div>
<h2>Commandes</h2><div class="list" id="olist"></div></div></main>
<div id="ftr"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="settings.js"></script><script src="common.js"></script>
<script>
async function show(){const {data:{session}}=await sb.auth.getSession();$('lf').classList.toggle('hide',!!session);$('panel').classList.toggle('hide',!session);if(session){loadP();loadO()}}
$('lf').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});if(error)return alert(error.message);show()};
$('out').onclick=async()=>{await sb.auth.signOut();show()};
$('af').onsubmit=async e=>{e.preventDefault();$('addb').disabled=true;const urls=[];
for(const f of $('img').files){const path=Date.now()+'-'+f.name.replace(/[^a-z0-9.]/gi,'_');const {error}=await sb.storage.from('products').upload(path,f);if(error){$('addb').disabled=false;return alert(error.message)}urls.push(sb.storage.from('products').getPublicUrl(path).data.publicUrl)}
const {error}=await sb.from('products').insert({name:$('nm').value,description:$('ds').value,category:$('ct').value,price:+$('pr').value,old_price:$('op').value?+$('op').value:null,images:urls,image_url:urls[0]||null});
$('addb').disabled=false;if(error)return alert(error.message);$('af').reset();loadP()};
async function loadP(){const {data}=await sb.from('products').select('*').order('created_at',{ascending:false});
$('plist').innerHTML=(data||[]).map(p=>`<div class="item"><div style="display:flex;gap:12px;align-items:center">${imgs(p)[0]?`<img src="${esc(imgs(p)[0])}" alt="">`:''}<div>${esc(p.name)}<small>${CATS[p.category]||''} · ${fmt(p.price)}${p.old_price?' (soldes)':''}</small></div></div><button class="danger" data-id="${p.id}">Supprimer</button></div>`).join('')||'<p>Aucun produit.</p>'}
$('plist').onclick=async e=>{const b=e.target.closest('button');if(!b||!confirm('Supprimer ce produit ?'))return;await sb.from('products').delete().eq('id',b.dataset.id);loadP()};
async function loadO(){const {data}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(100);
$('olist').innerHTML=(data||[]).map(o=>`<div class="item"><div>${esc(o.product_name)} × ${o.quantity} — <b>${fmt(o.total)}</b><small>${esc(o.customer_name)} · ${esc(o.phone)} · ${esc(o.wilaya)}, ${esc(o.commune)} · ${esc(o.delivery_type)}</small><small>${new Date(o.created_at).toLocaleString('fr-FR')}</small></div></div>`).join('')||'<p>Aucune commande.</p>'}
show();
</script></body></html>
